          type: string
          format: date-time
        dataPedido:
          type: string
          format: date-time
          nullable: true
        valorUtilizado:
          type: number
        valorTotal:
          type: number
        saldo:
          type: number
        situacao:
          type: string
          nullable: true
        tipo:
          type: string
          description: ENTRADA or SAIDA.

