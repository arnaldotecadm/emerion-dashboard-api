          nullable: true
        codSt1:
          type: string
          nullable: true
        codUnd:
          type: string
          nullable: true
        vluRe2:
          type: number
          nullable: true
        dscRe2:
          type: number
          nullable: true
        dsrRe2:
          type: number
          nullable: true
